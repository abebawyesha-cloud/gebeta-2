
<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gebeta 🇪🇹 | Ethiopian Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7f8;
      color: #17202a;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #087f5b;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 22px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    nav a:hover {
      color: #087f5b;
    }

    .login-btn {
      background: #087f5b;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      padding: 70px 6%;
      background: linear-gradient(135deg, #087f5b, #064e3b);
      color: white;
    }

    .hero-content {
      max-width: 850px;
    }

    .hero h1 {
      font-size: 48px;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 30px;
      color: #e6fffa;
    }

    .search-box {
      background: white;
      padding: 8px;
      border-radius: 14px;
      display: flex;
      max-width: 700px;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 15px;
      font-size: 16px;
      color: #333;
    }

    .search-box button {
      border: none;
      background: #f59f00;
      color: white;
      padding: 0 25px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    section {
      padding: 50px 6%;
    }

    .section-title {
      font-size: 30px;
      margin-bottom: 25px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
    }

    .category {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 22px 10px;
      border-radius: 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
